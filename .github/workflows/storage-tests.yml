name: page-storage-tests

on:
  push:
    branches: [os-storage-core]
  pull_request:
    paths:
      - 'page-storage-system/**'
      - '.github/workflows/storage-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page-storage-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: page-storage-system/pom.xml
      - run: mvn --batch-mode clean test
