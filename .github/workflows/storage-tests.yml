name: page-storage-tests

on:
  push:
    branches: [os-storage-core]
  pull_request:
    paths:
      - 'page-storage-system/**'
      - '.github/workflows/storage-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page-storage-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q
