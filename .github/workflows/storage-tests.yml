name: three-module-storage-integration

on:
  push:
    branches: [os-storage-core]
  pull_request:
    paths:
      - 'page-storage-system/**'
      - 'database-engine/**'
      - 'sql-compiler/**'
      - 'pom.xml'
      - '.github/workflows/storage-tests.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build and test the current three-module branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mvn --batch-mode clean verify
          if ($LASTEXITCODE -ne 0) { throw 'Three-module Maven verification failed' }
          ./page-storage-system/verification/verify-sql-integration.ps1 -DatabaseJar ./database-engine/target/chainpage-db.jar -EvidenceDirectory ./ci-sql-evidence -CliArguments @('--json')
      - name: Collect evidence inside the checkout
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-evidence -Force | Out-Null
          foreach ($module in @('sql-compiler', 'page-storage-system', 'database-engine')) {
            $reports = "$module/target/surefire-reports"
            if (Test-Path -LiteralPath $reports) {
              Copy-Item -LiteralPath $reports -Destination "ci-evidence/$module" -Recurse
            }
          }
          if (Test-Path -LiteralPath ci-sql-evidence) {
            Copy-Item -LiteralPath ci-sql-evidence -Destination ci-evidence/sql -Recurse
          }
      - name: Preserve test and actual SQL evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-verification-${{ matrix.os }}
          path: ci-evidence/
